[project]
name = "sbm-coil-capture"
version = "0.1.0"
description = "Basler camera coil image capture sender and Flask receiver"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyYAML",
    "flask",
    "gpiozero",
    "lgpio; sys_platform == 'linux'",
    "pypylon",
    "requests",
    "waitress",
]

[project.scripts]
sbm-capture = "capture.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capture"]

[tool.ruff]
line-length = 88
target-version = "py39"
